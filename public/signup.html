<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sign Up | AskLive</title>

  <link rel="stylesheet" href="signup.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>

  <div class="background-glow glow1"></div>
  <div class="background-glow glow2"></div>

  <div class="signup-container">

    <div class="signup-card">

      <h1>Create Account</h1>

      <p class="subtitle">
        Join AskLive and start interactive sessions
      </p>

      <form>

        <div class="input-box">
          <label>Email</label>
          <input type="email" placeholder="Enter your email">
          <p class="error signup-email-error"></p>
        </div>

        <div class="input-box">
          <label>Password</label>
          <input type="password" placeholder="Create password">
          <p class="error signup-password-error"></p>
        </div>

        <div class="input-box">
          <label>Confirm Password</label>
          <input type="password" placeholder="Confirm password">
          <p class="error signup-confirm-error"></p>
        </div>

        <button type="submit" class="signup-btn">
          Create Account
        </button>

      </form>
      <div class="divider"><span>or</span></div>
      <button type="button" class="google-btn" id="googleSignupBtn">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" height="20">
        Continue with Google
      </button>

      <p class="login-text">
        Already have an account?
        <a href="login.html">Login</a>
      </p>

    </div>

  </div>

  <script src="signup.js"></script>

</body>

</html>
