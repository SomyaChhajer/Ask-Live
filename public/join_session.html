<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Session | AskLive</title>
  <link rel="stylesheet" href="login.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <div class="background-glow glow1"></div>
  <div class="background-glow glow2"></div>
  <div class="login-container">
    <div class="login-card">
      <h1>Join Session</h1>
      <p class="subtitle">Enter the session code to join</p>
      <form>
        <div class="input-box">
          <label>Session Code</label>
          <input type="text" id="sessionCode" placeholder="Enter session code e.g. ABC123" autocomplete="off"
            autocorrect="off" autocapitalize="characters" spellcheck="false" style="text-transform:uppercase">
          <p class="error code-error"></p>
        </div>
        <button type="submit" class="login-btn">Join Now</button>
      </form>
      <p class="signup-text">
        <a href="index.html">← Back to Home</a>
      </p>
    </div>
  </div>
  <script src="join_session.js"></script>
</body>

</html>
